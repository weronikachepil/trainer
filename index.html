/* ------------------------------------------------------------------ стан */
const ALL = MQ.concat(WQ);
const byId = {}; ALL.forEach(x=>byId[x.id]=x);
const KEY = 'oop-trainer-v1';
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { store = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} }
function rec(id, frac){ const r = store[id] || {n:0,ok:0}; r.n++; r.last = frac; if (frac >= 1) r.ok++; store[id] = r; save(); }
function isOk(x){ const r = store[x.id]; if (!r) return false; return x.type === 'w' ? r.last >= 0.7 : r.last >= 1; }
function seen(x){ return !!store[x.id]; }

/* збереження незавершеної сесії (тест, контрольна, картки), щоб продовжити після перезавантаження */
const SKEY = 'oop-trainer-session-v1';
function persist(){
  try {
    if (!S || S.done) { localStorage.removeItem(SKEY); return; }
    localStorage.setItem(SKEY, JSON.stringify({
      mode:S.mode, title:S.title, ids:S.items.map(x=>x.id), i:S.i,
      ans:S.ans, order:S.order, wr:S.wr, text:S.text, flip:S.flip, res:S.res
    }));
  } catch(e) {}
}
function loadSession(){
  try {
    const d = JSON.parse(localStorage.getItem(SKEY));
    if (!d || !Array.isArray(d.ids)) return null;
    const pool = d.mode==='cards' ? CARDS : ALL;
    const map = {}; pool.forEach(x=>map[x.id]=x);
    const items = d.ids.map(id=>map[id]);
    if (!items.length || items.some(x=>!x)) return null;
    const i = Math.min(Math.max(+d.i||0, 0), items.length-1);
    return {mode:d.mode, title:d.title, items, i, ans:d.ans||{}, order:d.order||{}, wr:d.wr||{}, text:d.text||{}, flip:!!d.flip, res:d.res||{}, done:false};
  } catch(e) { return null; }
}
function clearSession(){ try { localStorage.removeItem(SKEY); } catch(e) {} }

let S = null;            // активна сесія
let confirmReset = false;

/* ------------------------------------------------------------------ утиліти */
const app = document.getElementById('app');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
const para = s => String(s).split('\n').map(p => '<p>'+fmt(p)+'</p>').join('');
const LTR = ['А','Б','В','Г','Д'];
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function pick(arr, n){ return shuffle(arr).slice(0, n); }
function pct(a,b){ return b ? Math.round(100*a/b) : 0; }
function plural(n, one, few, many){ const m10 = n%10, m100 = n%100; if (m10===1 && m100!==11) return one; if (m10>=2 && m10<=4 && (m100<10||m100>=20)) return few; return many; }

/* ------------------------------------------------------------------ запуск сесій */
function start(mode, title, items){
  if (!items.length) return;
  S = {mode, title, items, i:0, ans:{}, order:{}, wr:{}, text:{}, done:false};
  render(); window.scrollTo(0,0);
}
function startMock(){
  const mcq = {1:2,2:3,3:3,4:2,6:4}, wr = {1:1,2:1,3:1,4:1,6:2};
  let items = [];
  LECS.forEach(l => {
    items = items.concat(pick(MQ.filter(x=>x.lec===l), mcq[l]));
    items = items.concat(pick(WQ.filter(x=>x.lec===l), wr[l]));
  });
  start('mock','Контрольна на 20 питань', shuffle(items));
}
function startTopic(l, type){
  const pool = (type==='w'?WQ:MQ).filter(x=>x.lec===l);
  start('practice', LEC_SHORT[l] + (type==='w'?' · письмові':' · тести'), shuffle(pool));
}
function startRandom(){ start('practice','10 випадкових питань', pick(MQ,10)); }
function startMistakes(){ start('practice','Робота над помилками', shuffle(ALL.filter(x=>seen(x)&&!isOk(x)))); }
function startWritten(){ start('practice','Письмові питання', shuffle(WQ)); }

function knownCard(x){ const r = store[x.id]; return !!(r && r.known); }
function startCards(l){
  const pool = CARDS.filter(x => !l || x.lec === l);
  const unk = pool.filter(x => !knownCard(x));
  S = {mode:'cards', title: l ? LEC_SHORT[l]+' · картки' : 'Картки з термінами', items: shuffle(unk.length ? unk : pool), i:0, flip:false, res:{}, done:false};
  render(); window.scrollTo(0,0);
}
function cardsView(){
  const n = S.items.length;
  if (S.done){
    const know = S.items.filter(x => S.res[x.id]).length;
    const rest = n - know;
    return `<div class="top"><div class="row"><button class="btn sm ghost" data-act="exit">← Меню</button></div></div>
    <div class="card"><div class="eyebrow">${esc(S.title)}</div>
      <div class="score"><b>${pct(know,n)}%</b><span><strong>Знали ${know} з ${n}</strong><br><span class="muted">${rest ? 'Ще '+rest+' '+plural(rest,'термін','терміни','термінів')+' варто повторити' : 'Усі терміни з цієї колоди знаєте'}</span></span></div>
      <div class="row">${rest?'<button class="btn primary" data-act="cards-redo">Повторити невідомі</button>':''}<button class="btn" data-act="exit">До меню</button></div></div>`;
  }
  const it = S.items[S.i];
  return `<div class="top">
    <div class="row"><button class="btn sm ghost" data-act="exit">← Меню</button><span class="count">${S.i+1} / ${n}</span></div>
    <div class="row" style="justify-content:space-between"><h2>${esc(S.title)}</h2><span class="small muted">Пробіл: перегорнути</span></div>
    <div class="bar"><i style="width:${pct(S.i+1,n)}%"></i></div></div>
  <div class="card">
    <div class="tag">${esc(LEC_SHORT[it.lec])}</div>
    <div class="qtext" style="font-size:1.4rem;line-height:1.3">${fmt(it.term)}</div>
    ${S.flip ? '<div class="model">'+para(it.def)+'</div>' : ''}
  </div>
  ${S.flip
    ? '<div class="nav"><button class="btn" data-act="dunno">Ще повторю (2)</button><button class="btn primary" data-act="know">Знав (1)</button></div>'
    : '<div class="nav"><span></span><button class="btn primary" data-act="flip">Показати визначення</button></div>'}`;
}
function cardAnswer(ok){
  const it = S.items[S.i];
  S.res[it.id] = ok;
  store[it.id] = Object.assign(store[it.id] || {}, {known: ok}); save();
  S.flip = false;
  if (S.i < S.items.length-1) S.i++; else S.done = true;
  render(); window.scrollTo(0,0);
}

/* ------------------------------------------------------------------ вигляди */
function home(){
  const rs = loadSession();
  const resumeHtml = rs ? `<div class="panel main">
    <h2>Незавершена сесія</h2>
    <p class="muted">${esc(rs.title)} · питання ${rs.i+1} з ${rs.items.length}</p>
    <div class="row"><button class="btn primary" data-act="resume">Продовжити</button><button class="btn ghost" data-act="discard">Відкинути</button></div>
  </div>` : '';
  const st = ALL.filter(seen).length, ok = ALL.filter(isOk).length;
  const wrong = ALL.filter(x=>seen(x)&&!isOk(x)).length;
  const topics = LECS.map(l=>{
    const m = MQ.filter(x=>x.lec===l), wq = WQ.filter(x=>x.lec===l), all = m.concat(wq);
    const okc = all.filter(isOk).length;
    return `<div class="topic">
      <div class="meta"><div class="name">${esc(LEC[l])}</div>
        <div class="small muted">${m.length} тестових · ${wq.length} письмових · засвоєно ${okc} з ${all.length}</div>
        <div class="bar good"><i style="width:${pct(okc,all.length)}%"></i></div></div>
      <div class="acts"><button class="btn sm" data-act="topic" data-l="${l}" data-t="m">Тести</button>
      <button class="btn sm" data-act="topic" data-l="${l}" data-t="w">Письмові</button>
      <button class="btn sm" data-act="cards" data-l="${l}">Картки</button></div></div>`;
  }).join('');
  return `
  <div class="hero">
    <div class="eyebrow">C++ · C# · UML</div>
    <h1>ООП: тренажер до контрольної</h1>
    <p>${MQ.length} тестових питань з варіантами А–Д, ${WQ.length} письмових і ${CARDS.length} карток з термінами за лекціями 1–4 та 5–6. Букви правильних відповідей щоразу випадкові. Прогрес зберігається в цьому браузері.</p>
  </div>
  ${resumeHtml}
  <div class="panel main">
    <h2>Контрольна на 20 питань</h2>
    <p class="muted">14 тестових і 6 письмових, розподіл за темами як у реальній роботі. Пояснення з\'являються наприкінці.</p>
    <div class="row"><button class="btn primary" data-act="mock">Почати контрольну</button></div>
  </div>
  <div class="quick">
    <div class="panel"><h2>10 випадкових</h2><p class="small muted">Швидка серія тестів, після кожної відповіді одразу пояснення.</p><div class="row"><button class="btn sm" data-act="random">Розпочати</button></div></div>
    <div class="panel"><h2>Помилки</h2><p class="small muted">${wrong ? 'Питання, на які востаннє відповіли неправильно: '+wrong+'.' : 'Поки що помилок немає.'}</p><div class="row"><button class="btn sm" data-act="mistakes" ${wrong?'':'disabled'}>Повторити</button></div></div>
    <div class="panel"><h2>Картки</h2><p class="small muted">${CARDS.length} термінів: прочитайте термін, згадайте визначення, перевірте себе. Вивчено ${CARDS.filter(knownCard).length}.</p><div class="row"><button class="btn sm" data-act="cards" data-l="0">Розпочати</button></div></div>
    <div class="panel"><h2>Письмові</h2><p class="small muted">${WQ.length} питань з еталонною відповіддю та самоперевіркою за пунктами.</p><div class="row"><button class="btn sm" data-act="written">Розпочати</button></div></div>
  </div>
  <div class="panel">
    <h2>Ваш прогрес</h2>
    <div class="stats">
      <div class="stat"><b>${st}</b><span class="small muted">з ${ALL.length} питань бачили</span></div>
      <div class="stat"><b>${ok}</b><span class="small muted">засвоєно</span></div>
      <div class="stat"><b>${pct(ok,ALL.length)}%</b><span class="small muted">від усієї бази</span></div>
    </div>
    <div class="bar good"><i style="width:${pct(ok,ALL.length)}%"></i></div>
  </div>
  <div class="panel topics"><h2 style="padding-top:12px">За темами</h2>${topics}</div>
  <div class="row foot" style="justify-content:space-between">
    <span>Джерело: лекції 1–4 та 5–6 з курсу ООП (C++/C#).</span>
    ${confirmReset
      ? '<span class="row"><span>Стерти весь прогрес?</span><button class="btn sm" data-act="reset-yes">Так, стерти</button><button class="btn sm ghost" data-act="reset-no">Скасувати</button></span>'
      : '<button class="btn sm ghost" data-act="reset">Скинути прогрес</button>'}
  </div>`;
}

function optsHtml(it){
  const ord = S.order[it.id] || (S.order[it.id] = shuffle(it.opts.map((_,i)=>i)));
  const chosen = S.ans[it.id];
  const locked = S.mode==='practice' && chosen!==undefined;
  return '<div class="opts">' + ord.map((oi,k)=>{
    let c = 'opt';
    if (chosen===oi) c += ' sel';
    if (locked){ c += ' locked'; if (oi===0) c += ' right'; else if (chosen===oi) c += ' wrong'; }
    return `<button class="${c}" data-act="pick" data-oi="${oi}"><span class="ltr">${LTR[k]}</span><span>${fmt(it.opts[oi])}</span></button>`;
  }).join('') + '</div>';
}
function wrState(it){ return S.wr[it.id] || (S.wr[it.id] = {rev:false, checks: it.key.map(()=>false)}); }
function writtenHtml(it){
  const st = wrState(it);
  const got = st.checks.filter(Boolean).length;
  let h = `<textarea id="ans" placeholder="Напишіть свою відповідь тут, потім порівняйте з еталоном" data-id="${it.id}">${esc(S.text[it.id]||'')}</textarea>`;
  if (!st.rev) return h + '<div class="row"><button class="btn primary" data-act="reveal">Показати еталонну відповідь</button></div>';
  h += `<div class="model"><div class="eyebrow">Еталонна відповідь</div>${para(it.model)}${it.code?'<pre><code>'+esc(it.code)+'</code></pre>':''}</div>`;
  h += `<div><div class="eyebrow" style="margin-bottom:8px">Що ви згадали? Позначте пункти <span id="gotn" class="count">(${got} з ${it.key.length})</span></div><div class="checks">` +
    it.key.map((k,i)=>`<label class="check"><input type="checkbox" data-act="chk" data-k="${i}" ${st.checks[i]?'checked':''}><span>${fmt(k)}</span></label>`).join('') + '</div></div>';
  return h;
}
function quiz(){
  const it = S.items[S.i], n = S.items.length, mock = S.mode==='mock';
  const answered = x => x.type==='m' ? S.ans[x.id]!==undefined : (S.wr[x.id] && S.wr[x.id].rev);
  const done = S.items.filter(answered).length;
  let body = `<div class="tag">${esc(LEC_SHORT[it.lec])} · ${it.type==='m'?'тест':'письмове'}</div>
    <div class="qtext">${fmt(it.text)}</div>${it.code && it.type==='m' ? '<pre><code>'+esc(it.code)+'</code></pre>' : ''}`;
  if (it.type==='m'){
    body += optsHtml(it);
    if (!mock && S.ans[it.id]!==undefined){
      const good = S.ans[it.id]===0;
      body += `<div class="fb ${good?'ok':'no'}"><strong class="${good?'ok':'no'}">${good?'Правильно':'Неправильно'}</strong>${para(it.why)}</div>`;
    }
  } else body += writtenHtml(it);
  const last = S.i === n-1;
  const pal = mock ? '<div class="pal">' + S.items.map((x,i)=>`<button data-act="go" data-i="${i}" class="${i===S.i?'cur':answered(x)?'done':''}" aria-label="Питання ${i+1}">${i+1}</button>`).join('') + '</div>' : '';
  return `<div class="top">
    <div class="row"><button class="btn sm ghost" data-act="exit">← Меню</button><span class="count">${S.i+1} / ${n}</span></div>
    <div class="row" style="justify-content:space-between"><h2>${esc(S.title)}</h2><span class="small muted">відповіли: ${done}</span></div>
    <div class="bar"><i style="width:${pct(S.i+1,n)}%"></i></div>${pal}</div>
  <div class="card">${body}</div>
  <div class="nav">
    <button class="btn" data-act="prev" ${S.i===0?'disabled style="opacity:.4"':''}>Назад</button>
    <button class="btn primary" data-act="next">${last ? (mock?'Завершити й побачити результат':'Завершити') : 'Далі'}</button>
  </div>`;
}

function score(it){
  if (it.type==='m') return S.ans[it.id]===0 ? 1 : 0;
  const w = S.wr[it.id]; if (!w || !w.rev) return 0;
  return w.checks.filter(Boolean).length / it.key.length;
}
function results(){
  const items = S.items, total = items.length;
  const sc = items.reduce((a,x)=>a+score(x),0);
  const p = pct(sc,total);
  const verdict = p>=90?'Відмінно':p>=75?'Добре':p>=60?'Задовільно':'Потрібно повторити';
  const byLec = LECS.map(l=>{
    const xs = items.filter(x=>x.lec===l); if (!xs.length) return '';
    const s = xs.reduce((a,x)=>a+score(x),0);
    return `<div><span>${esc(LEC_SHORT[l])}</span><span class="count" style="text-align:right">${(Math.round(s*10)/10)} / ${xs.length}</span><div class="bar good"><i style="width:${pct(s,xs.length)}%"></i></div></div>`;
  }).join('');
  const list = items.map((x,i)=>{
    const s = score(x), cls = s>=1?'ok':s>0?'mid':'no', sym = s>=1?'✓':s>0?'½':'✗';
    let b;
    if (x.type==='m'){
      const ch = S.ans[x.id];
      b = (x.code?'<pre><code>'+esc(x.code)+'</code></pre>':'') +
        `<p><strong>Ваша відповідь:</strong> ${ch===undefined?'не відповіли':fmt(x.opts[ch])}</p>` +
        (ch===0?'':`<p><strong>Правильно:</strong> ${fmt(x.opts[0])}</p>`) + para(x.why);
    } else {
      const w = S.wr[x.id];
      b = `<div class="model"><div class="eyebrow">Еталон</div>${para(x.model)}${x.code?'<pre><code>'+esc(x.code)+'</code></pre>':''}</div>` +
        `<p class="small muted">Згадано пунктів: ${w&&w.rev?w.checks.filter(Boolean).length:0} з ${x.key.length}${w&&w.rev?'':' (еталон не відкривали)'}</p>`;
    }
    return `<details><summary><span class="mark ${cls}">${sym}</span><span>${i+1}. ${fmt(x.text)}</span></summary><div class="body">${b}</div></details>`;
  }).join('');
  const bad = items.filter(x=>score(x)<1).length;
  return `<div class="top"><div class="row"><button class="btn sm ghost" data-act="exit">← Меню</button></div></div>
  <div class="card">
    <div class="eyebrow">${esc(S.title)}</div>
    <div class="score"><b>${p}%</b><span><strong>${verdict}</strong><br><span class="muted">${Math.round(sc*10)/10} з ${total} балів</span></span></div>
    <div class="lecs">${byLec}</div>
    <div class="row">
      ${bad?'<button class="btn primary" data-act="redo">Повторити '+bad+' '+plural(bad,'питання','питання','питань')+' з помилками</button>':''}
      <button class="btn" data-act="mock">Нова контрольна</button>
    </div>
  </div>
  <h2>Розбір відповідей</h2><div class="lecs" style="gap:10px">${list}</div>`;
}

function render(){
  if (S) persist();
  if (!S) app.innerHTML = home();
  else if (S.mode==='cards') app.innerHTML = cardsView();
  else if (S.done) app.innerHTML = results();
  else app.innerHTML = quiz();
}

/* ------------------------------------------------------------------ дії */
function commitWritten(it){
  if (S.mode==='practice' && it.type==='w'){
    const w = S.wr[it.id];
    if (w && w.rev) rec(it.id, w.checks.filter(Boolean).length / it.key.length);
  }
}
function finish(){
  if (S.mode==='mock'){
    S.items.forEach(x=>{
      if (x.type==='m'){ if (S.ans[x.id]!==undefined) rec(x.id, S.ans[x.id]===0?1:0); }
      else { const w = S.wr[x.id]; if (w && w.rev) rec(x.id, w.checks.filter(Boolean).length / x.key.length); }
    });
  }
  S.done = true; render(); window.scrollTo(0,0);
}
app.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if (!b || b.type==='checkbox') return;
  const a = b.dataset.act;
  if (a==='mock') startMock();
  else if (a==='random') startRandom();
  else if (a==='mistakes') startMistakes();
  else if (a==='written') startWritten();
  else if (a==='topic') startTopic(+b.dataset.l, b.dataset.t);
  else if (a==='exit'){ persist(); S = null; render(); window.scrollTo(0,0); }
  else if (a==='resume'){ const rs = loadSession(); if (rs){ S = rs; render(); window.scrollTo(0,0); } }
  else if (a==='discard'){ clearSession(); render(); }
  else if (a==='reset'){ confirmReset = true; render(); }
  else if (a==='reset-no'){ confirmReset = false; render(); }
  else if (a==='reset-yes'){ store = {}; save(); clearSession(); confirmReset = false; render(); }
  else if (a==='cards') startCards(+b.dataset.l || 0);
  else if (S && S.mode==='cards'){
    if (a==='flip'){ S.flip = true; render(); }
    else if (a==='know') cardAnswer(true);
    else if (a==='dunno') cardAnswer(false);
    else if (a==='cards-redo'){ const rest = S.items.filter(x=>!S.res[x.id]); S = {mode:'cards', title:S.title, items:shuffle(rest), i:0, flip:false, res:{}, done:false}; render(); window.scrollTo(0,0); }
  }
  else if (a==='redo'){ const bad = S.items.filter(x=>score(x)<1); start('practice','Повторення помилок', shuffle(bad)); }
  else if (S){
    const it = S.items[S.i];
    if (a==='pick'){
      if (S.mode==='practice' && S.ans[it.id]!==undefined) return;
      S.ans[it.id] = +b.dataset.oi;
      if (S.mode==='practice') rec(it.id, S.ans[it.id]===0?1:0);
      render();
    }
    else if (a==='reveal'){ wrState(it).rev = true; render(); }
    else if (a==='go'){ commitWritten(it); S.i = +b.dataset.i; render(); window.scrollTo(0,0); }
    else if (a==='prev'){ if (S.i>0){ commitWritten(it); S.i--; render(); window.scrollTo(0,0); } }
    else if (a==='next'){
      commitWritten(it);
      if (S.i < S.items.length-1){ S.i++; render(); window.scrollTo(0,0); } else finish();
    }
  }
});
app.addEventListener('change', e=>{
  const c = e.target.closest('input[data-act="chk"]'); if (!c || !S) return;
  const it = S.items[S.i], st = wrState(it);
  st.checks[+c.dataset.k] = c.checked;
  persist();
  const el = document.getElementById('gotn');
  if (el) el.textContent = '(' + st.checks.filter(Boolean).length + ' з ' + it.key.length + ')';
});
app.addEventListener('input', e=>{
  if (e.target.id==='ans' && S){ S.text[e.target.dataset.id] = e.target.value; persist(); }
});
document.addEventListener('keydown', e=>{
  if (!S || S.done || e.target.tagName==='TEXTAREA' || e.ctrlKey || e.metaKey) return;
  if (S.mode==='cards'){
    if (e.key===' ' && !S.flip){ e.preventDefault(); S.flip = true; render(); }
    else if (S.flip && e.key==='1') cardAnswer(true);
    else if (S.flip && e.key==='2') cardAnswer(false);
    return;
  }
  const it = S.items[S.i];
  if (it.type==='m' && /^[1-5]$/.test(e.key)){
    const btn = app.querySelectorAll('.opt')[+e.key-1]; if (btn) btn.click();
  }
});
render();
</script>

</body></html>

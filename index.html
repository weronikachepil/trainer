<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ООП Тренажер</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: одна вузька колонка, меню режимів зверху, далі теми; у тесті картка питання з великими кнопками варіантів А–Д */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --fg:#162030; --muted:#566376; --line:#d8dee7;
  --accent:#2f5bea; --accent-fg:#ffffff; --accent-soft:#e6ecfd;
  --good:#17794f; --good-bg:#e1f3ea; --bad:#b3322b; --bad-bg:#fbe5e3; --warn:#9a6200; --warn-bg:#fdf0d5;
  --code-bg:#eceff5;
  --font:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e131a; --surface:#151c26; --fg:#e5eaf1; --muted:#93a0b2; --line:#263140;
    --accent:#7b9cff; --accent-fg:#0e131a; --accent-soft:#1a2540;
    --good:#5fd39a; --good-bg:#12301f; --bad:#ff8f86; --bad-bg:#3a1a18; --warn:#f2b84b; --warn-bg:#3a2d10;
    --code-bg:#0b1017; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#151c26; --fg:#e5eaf1; --muted:#93a0b2; --line:#263140;
  --accent:#7b9cff; --accent-fg:#0e131a; --accent-soft:#1a2540;
  --good:#5fd39a; --good-bg:#12301f; --bad:#ff8f86; --bad-bg:#3a1a18; --warn:#f2b84b; --warn-bg:#3a2d10;
  --code-bg:#0b1017; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:20px 56px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.1rem;font-weight:650}
p{margin:0}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:.08em .35em;border-radius:4px}
pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:.85rem;line-height:1.5;tab-size:2}
pre code{background:none;padding:0;font-size:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* кнопки */
.btn{border:1px solid var(--line);background:var(--surface);padding:.6rem 1rem;border-radius:8px;font-weight:550;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:.35rem .75rem;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* меню */
.hero{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.hero p{max-width:60ch;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel.main{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.quick .panel{gap:8px}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.1}
.topics{display:flex;flex-direction:column;gap:0;padding:6px 18px}
.topic{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.topic:last-child{border-bottom:0}
.topic .name{font-weight:600}
.topic .meta{grid-column:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.topic .acts{grid-column:2;grid-row:1 / span 1;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:520px){.topic{grid-template-columns:1fr}.topic .acts{grid-column:1;grid-row:auto;justify-content:flex-start}}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.good i{background:var(--good)}

/* тест */
.top{display:flex;flex-direction:column;gap:10px}
.top .row{justify-content:space-between}
.count{font-variant-numeric:tabular-nums;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.qtext{font-size:1.08rem;font-weight:550;line-height:1.45}
.tag{display:inline-block;font-size:.76rem;font-weight:600;padding:.12rem .55rem;border-radius:99px;background:var(--accent-soft);color:var(--accent);align-self:flex-start}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px}
.opt:hover{border-color:var(--accent)}
.opt .ltr{flex:none;width:28px;height:28px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;font-weight:650;font-size:.9rem}
.opt span:last-child{min-width:0;overflow-wrap:anywhere;padding-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .ltr{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.opt.locked{pointer-events:none}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .ltr{background:var(--good);color:var(--bg);border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .ltr{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-bg)}
.fb.no{background:var(--bad-bg)}
.fb strong.ok{color:var(--good)}
.fb strong.no{color:var(--bad)}
.nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.pal{display:flex;gap:6px;flex-wrap:wrap}
.pal button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums;padding:0}
.pal button.done{background:var(--accent-soft);border-color:var(--accent)}
.pal button.cur{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

/* письмові */
textarea{width:100%;min-height:130px;resize:vertical;font:inherit;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.model{background:var(--accent-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.model p{line-height:1.55}
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.check input{margin-top:4px;width:18px;height:18px;flex:none;accent-color:var(--accent)}

/* результати */
.score{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.score b{font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.lecs{display:flex;flex-direction:column;gap:8px}
.lecs div{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:.9rem}
.lecs .bar{grid-column:1 / -1}
details{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details summary{cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:flex-start;list-style:none}
details summary::-webkit-details-marker{display:none}
details .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.mark{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:.8rem;font-weight:700;margin-top:1px}
.mark.ok{background:var(--good-bg);color:var(--good)}
.mark.no{background:var(--bad-bg);color:var(--bad)}
.mark.mid{background:var(--warn-bg);color:var(--warn)}
.foot{font-size:.82rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>

<div class="wrap" id="app"></div>

<script>
/* ------------------------------------------------------------------ дані */
const LEC = {
  1:'Лекція 1 · Вступ до ООП',
  2:'Лекція 2 · Інкапсуляція, життєвий цикл, наслідування',
  3:'Лекція 3 · Поліморфізм і абстракція',
  4:'Лекція 4 · Типи значень/посилань, Generics',
  6:'Лекція 5–6 · UML: моделювання структури'
};
const LEC_SHORT = {1:'Вступ до ООП',2:'Інкапсуляція і наслідування',3:'Поліморфізм',4:'Типи та Generics',6:'UML (лекція 5–6)'};
const LECS = [1,2,3,4,6];

const MQ = [], WQ = [];
/* Тест: перший варіант у opts завжди правильний, порядок і букви перемішуються під час показу */
function q(lec, text, opts, why, code){ MQ.push({id:'m'+MQ.length, type:'m', lec, text, opts, why, code}); }
function w(lec, text, key, model, code){ WQ.push({id:'w'+WQ.length, type:'w', lec, text, key, model, code}); }

/* ---------- Лекція 1 ---------- */
q(1,'Яка головна відмінність ООП від процедурного стилю?',
 ['ООП об\'єднує дані й функції, що ними керують, в одну одиницю (клас) з контрольованим доступом',
  'В ООП немає функцій, є лише дані',
  'Процедурний стиль не підтримує функцій',
  'ООП працює лише з об\'єктами на стеку',
  'Процедурний стиль завжди швидший за ООП удвічі'],
 'Межа проходить не по наявності `private`, а по тому, чи об\'єднані стан і поведінка в одну одиницю з контрольованим доступом.');
q(1,'Що таке клас в ООП?',
 ['Креслення (шаблон), що описує поля й методи; сам не займає пам\'яті під дані',
  'Конкретний екземпляр, що живе в оперативній пам\'яті',
  'Вказівник на об\'єкт',
  'Функція, яка створює об\'єкти',
  'Файл із розширенням .h'],
 'Клас це креслення будинку, об\'єкт це збудований за ним будинок.');
q(1,'Що вірно для створення об\'єкта в C#?',
 ['Потрібне `new`; об\'єкт у керованій купі, а змінна зберігає посилання на нього',
  'Об\'єкт за замовчуванням створюється на стеку без `new`',
  'Для знищення потрібен явний `delete`',
  'Змінна зберігає копію всіх полів об\'єкта',
  'Об\'єкт створюється в заголовковому файлі'],
 'Класи в .NET це посилальні типи (reference types). У C++ об\'єкт без `new` за замовчуванням живе на стеку.');
q(1,'Де після закриваючої дужки тіла класу обов\'язкова крапка з комою?',
 ['У C++, але не в C#','У C#, але не в C++','В обох мовах','У жодній з мов','Лише в struct у C#'],
 'Це синтаксична особливість C++: `class A { ... };`');
q(1,'Який доступ за замовчуванням мають члени класу (class)?',
 ['private в обох мовах (C++ і C#)','public у C++, private у C#','private у C++, public у C#','protected в обох','internal в обох'],
 'Тому `public` у прикладах це функціональна необхідність, а не данина стилю.');
q(1,'Чому в C++ клас зазвичай розділяють на `.h` і `.cpp`?',
 ['Кожен .cpp компілюється окремо, тому оголошення (інтерфейс) виносять у заголовок для #include',
  'У C++ не можна писати тіла методів усередині класу',
  'Це вимога стандарту про заборону private',
  'Компілятор C++ сам сканує всі файли проєкту',
  'Так програма виконується швидше'],
 'Роздільна компіляція, успадкована від C. У C# компілятор Roslyn сам будує дерево типів, тому заголовків немає.');
q(1,'Що в C# використовують замість директиви `#include`?',
 ['Простори імен (`namespace`) і `using`','`import`','`header`','`extern`','`partial`'],
 '`using` лише вказує компілятору, де шукати класи, а не підключає файли фізично.');
q(1,'Яка конвенція іменування публічних членів у C#?',
 ['PascalCase','snake_case','camelCase','UPPER_CASE','kebab-case'],
 'У C++ зазвичай camelCase або snake_case.');
q(1,'Навіщо в прикладі `Account` поле `balance` зробили `private`?',
 ['Щоб змінювати його лише через Deposit/Withdraw, які перевіряють коректність',
  'Щоб воно займало менше пам\'яті',
  'Щоб компілятор не видавав помилок',
  'Щоб поле стало статичним',
  'Щоб клас став абстрактним'],
 'Логіка перевірки живе в одному місці, а не розкидана по програмі. Це і є інкапсуляція.');
q(1,'Для якої задачі природніше процедурний підхід?',
 ['Короткий скрипт-конвеєр: прочитати CSV, порахувати, записати JSON',
  'Відеогра з десятками сутностей зі своєю поведінкою',
  'GUI-застосунок, де кожна кнопка це об\'єкт',
  'Інтернет-магазин з користувачами й замовленнями',
  'Симуляція банку з багатьма об\'єктами'],
 'Якщо задачу природно описати як послідовність кроків над спільними даними, процедурний підхід простіший.');

/* ---------- Лекція 2 ---------- */
q(2,'У межах чого діє модифікатор `internal` у C#?',
 ['Збірки (assembly)','Простору імен','Одного файлу','Одного класу','Класу та його нащадків'],
 'Саме збірки, а не простору імен: інший файл у тому ж проєкті бачить internal-клас навіть в іншому namespace.');
q(2,'Який доступ за замовчуванням мають члени `struct` у C++?',
 ['public','private','protected','internal','Залежить від компілятора'],
 'Для `class` у C++ за замовчуванням private, для `struct` public.');
q(2,'Що станеться з автоматичним безпараметричним конструктором, якщо додати власний конструктор з параметрами?',
 ['Автоматичний зникне (і в C++, і в C#)','Залишиться','Стане private','Стане віртуальним','Зникне лише в C#'],
 'Якщо безпараметричний ще потрібен, його доведеться написати самому.');
q(2,'Який конструктор викликає `Point p2 = p1;` у C++?',
 ['Конструктор копіювання (згенерований компілятором, якщо не написаний)','Конструктор за замовчуванням','Оператор ==','Деструктор','Статичний конструктор'],
 'Згенерований варіант робить memberwise copy, тобто копіює кожне поле.');
q(2,'Що робить `Dog d2 = d1;` у C#, якщо Dog це class?',
 ['Копіює посилання: обидві змінні вказують на один об\'єкт','Створює повну незалежну копію','Викликає конструктор копіювання','Дає помилку компіляції','Обнуляє d1'],
 'Конструктора копіювання за замовчуванням у C# немає. Повну копію треба писати явно.');
q(2,'Що входить до «правила трьох» у C++?',
 ['Деструктор, конструктор копіювання, оператор копіювального присвоєння','Конструктор, деструктор, static','public, private, protected','new, delete, free','virtual, override, abstract'],
 'Якщо клас потребує власного одного з трьох, найімовірніше потрібні всі три. Із C++11 правило розширили до «правила п\'яти».');
q(2,'Що недоступне всередині статичного методу?',
 ['this','Інші статичні члени класу','Параметри методу','Локальні змінні','Виклик інших статичних методів'],
 'У статичного методу немає «поточного об\'єкта».');
q(2,'Чому метод `Main()` у C# статичний?',
 ['На старті програми ще не існує жодного об\'єкта','Так він працює швидше','Бо Main не може мати параметрів','Бо клас Program абстрактний','Бо його викликає збирач сміття'],
 'Стартова точка не може бути методом, прив\'язаним до об\'єкта.');
q(2,'Чим фіналізатор C# (`~Logger()`) принципово відрізняється від деструктора C++?',
 ['Момент виклику недетермінований: його вирішує збирач сміття','Викликається одразу при виході зі scope','Викликається на `delete`','Не може бути в класі','Викликається двічі'],
 'Для критичних ресурсів (файли, з\'єднання) у C# використовують IDisposable і `using`.');
q(2,'Що виведе код у C#?',
 ['False, бо `==` для класів порівнює посилання','True','Помилка компіляції','True, бо поля збігаються','Залежить від ціни'],
 'Це reference equality. Для змістовної рівності перевизначають `Equals` і `GetHashCode`.',
 `var b1 = new Book("1984", "Orwell", 150);
var b2 = new Book("1984", "Orwell", 150);
Console.WriteLine(b1 == b2);`);
q(2,'Якщо в C# перевизначено `Equals()`, що ще обов\'язково перевизначити?',
 ['GetHashCode()','ToString()','Dispose()','Finalize()','GetType()'],
 'Інакше об\'єкт поламає роботу `Dictionary` і `HashSet`.');
q(2,'Що означає RAII в C++?',
 ['Ресурс захоплюється в конструкторі й звільняється в деструкторі','Ресурс звільняє збирач сміття','Пам\'ять виділяється лише на купі','Винятки заборонені','Ініціалізація статичних полів'],
 'Resource Acquisition Is Initialization. Звільнення гарантоване навіть при винятку.');
q(2,'Який механізм C# відповідає RAII за призначенням?',
 ['`IDisposable` і `using`','Фіналізатор `~`','Статичний конструктор','`readonly`','`sealed`'],

w(1,'Поясніть, чому процедурний стиль стає незручним у великих програмах і як ООП розв\'язує ці проблеми.',
 ['Складність системи: сотні функцій над десятком структур даних','Зміна структури даних (масив на список) тягне переписування багатьох функцій','Дані відкриті: будь-яка частина програми може зламати їх стан','ООП об\'єднує стан і поведінку в клас','Інкапсуляція: доступ лише через контрольований інтерфейс'],
 'У процедурному стилі дані й функції існують окремо. Коли функцій сотні, а структур десяток, головним ворогом стає складність (Буч). Зміна однієї структури даних, наприклад заміна масиву на зв\'язний список, змушує переписувати десятки функцій, які «знали» про внутрішню будову даних.\nДодатково дані відкриті: будь-яка частина програми може напряму записати некоректне значення (`acc.balance = -500`), і ніщо цього не завадить.\nООП думає категоріями «які сутності беруть участь», а не «які дії виконати». Воно об\'єднує стан і поведінку в клас, а частину даних ховає (private) так, щоб змінювати їх можна було лише через методи з перевіркою (`Deposit`, `Withdraw`). Тоді логіка живе в одному місці, а помилку шукають серед ~20 методів одного класу, а не серед тисяч розкиданих функцій.');
w(1,'Порівняйте оголошення класу та створення об\'єкта в C++ і C# (назвіть щонайменше п\'ять відмінностей).',
 ['C++: крапка з комою після класу; C#: ні','Доступ: блоками `public:` у C++; перед кожним членом у C#','Об\'єкт у C++ за замовчуванням на стеку; у C# `new` і керована купа (reference type)','C++: .h + .cpp; C#: один .cs, namespace і using замість #include','Іменування: PascalCase у C#; camelCase/snake_case у C++','Спільне: члени за замовчуванням private']
 ,'C++: `class Car { public: ... };` з обов\'язковою крапкою з комою; специфікатор `public:` діє на все, що йде після нього. Об\'єкт `Car myCar;` створюється на стеку, знищується автоматично при виході зі scope.\nC#: крапки з комою після класу немає; `public`/`private` пишуть перед кожним членом. Класи це reference types: `new Car()` розміщує об\'єкт у керованій купі, а змінна зберігає посилання.\nФайли: C++ роздільна компіляція, оголошення в .h, реалізація в .cpp з префіксом `Car::`. C#: усе в одному .cs, компілятор Roslyn сам будує дерево типів; замість #include використовують namespace і using.\nІменування: у C# PascalCase для публічних членів. В обох мовах члени класу за замовчуванням private.');
w(2,'Опишіть життєвий цикл об\'єкта в C++ та C#: конструктор, знищення, звільнення ресурсів.',
 ['Конструктор: коректний початковий стан, один раз при створенні','C++: деструктор детермінований (delete або вихід зі scope)','C#: збирач сміття недетермінований, ~Logger це фіналізатор','RAII у C++ (ресурс у конструкторі, звільнення в деструкторі)','C#: IDisposable + using, finally','Забули delete у C++: memory leak']
 ,'Конструктор спрацьовує рівно один раз при створенні й приводить об\'єкт у коректний стан. Види в C++: за замовчуванням, з параметрами, копіювання; у C# копіювання за замовчуванням немає.\nЗнищення. У C++ деструктор детермінований: одразу після `delete` або при виході об\'єкта зі scope. Забули `delete` для об\'єкта в купі: витік пам\'яті. У C# пам\'ять звільняє збирач сміття в невідомий момент; `~Logger()` це фіналізатор, покладатися на нього для файлів чи з\'єднань не можна.\nРесурси. У C++ це RAII: ресурс захоплюється в конструкторі й звільняється в деструкторі, навіть якщо стався виняток. У C# для детермінованого звільнення є `IDisposable.Dispose()` і конструкція `using`; `finally` виконується завжди, але для ресурсів прийнято `using`.');
w(2,'Поясніть різницю між Is-A та Has-A, композицією та агрегацією. Чому радять надавати перевагу композиції над наслідуванням?',
 ['Is-A: наслідування (Dog є Animal); Has-A: поле іншого класу','Питання-лакмус: чи природно звучить «X є Y»?','Композиція: частина не існує без цілого, створюється всередині','Агрегація: частина незалежна, може бути спільною, передається ззовні','GoF 1994: favor composition over inheritance','Наслідування дає жорстке зчеплення, композиція гнучкіша (можна підмінити частину)']
 ,'Is-A («X є Y», Dog є Animal) реалізується наслідуванням. Has-A («X має Y», Car має Engine) реалізується композицією або агрегацією: один клас містить поле іншого. Якщо «X є Y» звучить неприродно, потрібен Has-A.\nКомпозиція: сильне володіння; частина не існує без цілого й зникає разом із ним (двигун, створений усередині Car). Агрегація: слабше; частина може існувати самостійно й пережити ціле (Студент і Група). На практиці дивляться, хто керує часом життя: сам клас-власник (композиція) чи об\'єкт передають ззовні (агрегація).\n«Надавайте перевагу композиції над наслідуванням» (GoF, 1994): наслідування створює сильне зчеплення, зміна базового класу впливає на всі похідні, а похідний клас залежить від реалізації бази. Композиція дозволяє динамічно змінювати складові (підмінити Engine) і робить систему гнучкішою.');
w(2,'Що таке проблема ромба? Як її розв\'язують C++ і C#?',
 ['Клас успадковує спільного предка двома шляхами, дві копії бази','Помилка ambiguous при виклику (turnOn, name)','C++: віртуальне наслідування, одна спільна копія, відповідальність на найпохіднішому класі','C#: лише один базовий клас + кілька інтерфейсів','Інтерфейс без стану й реалізації, конфлікт сигнатур: explicit implementation','Приклад: std::iostream']
 ,'Якщо Printer і Scanner успадковують Device, а Copier успадковує обидва, то в об\'єкті Copier два екземпляри Device, і виклик `turnOn()` неоднозначний (ambiguous). Аналогічно Bat від Mammal і Bird.\nC++ розв\'язує це віртуальним наслідуванням: `class Printer : virtual public Device`. Тоді в об\'єкті одна спільна копія бази. Плата: ускладнення компонування, а конструктор віртуальної бази викликає найпохідніший клас. Приклад зі стандарту: `std::iostream`.\nC# уникає проблеми на рівні мови: клас має лише одного базового класу, але реалізує будь-яку кількість інтерфейсів. Інтерфейс не містить стану й реалізації. Якщо два інтерфейси мають метод з однаковою сигнатурою, але різним змістом, їх реалізують окремо через explicit interface implementation.');
w(2,'Як у C# та C++ влаштована рівність об\'єктів? Що треба зробити для порівняння за змістом?',
 ['За замовчуванням порівнюються посилання/адреси','C#: перевизначити Equals(object)','Разом з Equals обов\'язково GetHashCode (Dictionary, HashSet)','C++: перевантажити operator==','Наслідок для пошуку в колекціях']
 ,'За замовчуванням `==` для класів у C# порівнює не вміст, а чи це один об\'єкт у пам\'яті (reference equality). Тому два `Book` з однаковими полями дають `False`.\nУ C# для змістовної рівності перевизначають `Equals(object obj)` і обов\'язково `GetHashCode()`, інакше зламаються `Dictionary` і `HashSet`. Альтернатива: `record` генерує їх автоматично.\nУ C++ спільного предка немає, тому перевантажують `operator==` (`bool operator==(const Book& other) const`).\nЯкщо цього не зробити, пошук об\'єкта за вмістом у колекції нічого не знайде, навіть якщо схожий об\'єкт там є.');
w(2,'У якому порядку ініціалізується об\'єкт похідного класу? Які пастки з цим пов\'язані?',
 ['Спочатку виділення пам\'яті, потім конструктор бази','Потім поля похідного класу','C++: у порядку оголошення в класі, а не списку ініціалізації','Потім тіло конструктора похідного','Деструктори у зворотному порядку','Не викликати virtual-метод у конструкторі бази']
 ,'Порядок: (1) виділяється пам\'ять; (2) виконується конструктор бази з ініціалізацією її полів; (3) ініціалізуються поля похідного класу (у C# інлайн-ініціалізатори після `base()`, у C++ члени ініціалізуються в порядку оголошення, а не в порядку списку ініціалізації); (4) виконується тіло конструктора похідного класу.\nКонструктори не успадковуються, тому похідний мусить викликати конструктор бази (`: base(name)` у C#, `: Animal(n)` у списку ініціалізації C++).\nДеструктори в C++ викликаються у зворотному порядку: ~Dog, потім ~Animal.\nПастка: не можна безпечно викликати virtual-метод у конструкторі бази й очікувати перевизначену версію, бо похідна частина ще не ініціалізована.');
w(3,'Поясніть різницю між статичним і динамічним зв\'язуванням. Яку роль відіграють `virtual`, `override` і `new`?',
 ['Статичне: рішення на етапі компіляції за оголошеним типом змінної','Динамічне: у runtime за реальним типом об\'єкта','virtual (база) + override (похідний) вмикають динамічне зв\'язування','Без virtual p->show() дає Base::show()','new: приховування, зв\'язується статично, виклик через базовий тип дає базову версію','Вартість невелика']
 ,'Статичне (раннє) зв\'язування: компілятор вирішує, яку функцію викликати, за оголошеним типом змінної. Стандарт для не-віртуальних методів. Динамічне (пізнє): рішення відкладається на runtime і приймається за реальним типом об\'єкта.\nУ C++ динамічне зв\'язування вмикає `virtual`; у C# пара `virtual` (база) і `override` (похідний). Приклад: `Base* p = new Derived(); p->show();` без virtual виведе `Base::show()`, з virtual `Derived::show()`.\nУ C# `new` означає приховування (method hiding): новий статично зв\'язаний метод, який лише «затуляє» батьківський при зверненні через тип похідного класу. Виклик через `Animal a = new Dog()` дасть базову версію. Без модифікатора компілятор дає попередження CS0114.\nДинамічне зв\'язування коштує трохи дорожче (читання адреси з таблиці), але різниця зазвичай у межах одиниць чи десятків відсотків.');
w(3,'Як працює динамічне зв\'язування «під капотом»? Поясніть vtable та vptr.',
 ['Для кожного класу з virtual створюється vtable (масив вказівників на функції)','Кожен об\'єкт має прихований vptr на vtable свого класу','Виклик: прочитати vptr, знайти запис у vtable, перейти за адресою','Перевизначення підміняє запис у vtable похідного класу','sizeof зростає (приклад 4 → 16)','.NET: Method Table, callvirt']
 ,'Компілятор створює для кожного класу, що має віртуальні методи, таблицю vtable: масив вказівників на функції, по одному запису на віртуальний метод. Кожен об\'єкт отримує прихований вказівник vptr на vtable його фактичного класу.\nПри виклику віртуального методу програма читає vptr об\'єкта, за ним знаходить запис у vtable й переходить за адресою. Якщо похідний клас перевизначив метод, запис у його vtable вказує на нову реалізацію, інакше лишається на успадковану.\nНаслідок: розмір об\'єкта збільшується (`sizeof(WithVirtual) = 16`: 8 байтів vptr + 4 int + 4 вирівнювання, проти 4 без virtual). У .NET схожий механізм: Method Table і інструкція `callvirt`.');
w(3,'Порівняйте абстрактні класи в C++ і C#. Чи можна створити їхній екземпляр?',
 ['C++: чиста віртуальна функція = 0, абстрактність неявна','C#: ключове слово abstract для класу й методу, без тіла','Екземпляр створити не можна','Нащадок мусить реалізувати всі абстрактні методи','Вказівники/посилання на абстрактний тип дозволені','Приклад: Shape::Area()']
 ,'Абстрактний метод оголошує лише сигнатуру, а реалізацію перекладає на нащадків (приклад: `Area()` у `Shape`).\nC++: чиста віртуальна функція `virtual double Area() const = 0;`. Клас, що має неперевизначену чисту віртуальну функцію, автоматично абстрактний, окремого ключового слова немає. Чиста віртуальна функція може мати тіло; якщо чистий деструктор, тіло обов\'язкове.\nC#: `abstract class Shape { public abstract double Area(); }`: слово `abstract` пишуть і перед класом, і перед кожним методом без реалізації; метод неявно віртуальний і не має тіла. Неабстрактний нащадок зобов\'язаний реалізувати його через `override`.\nОб\'єкт абстрактного класу створити неможливо (`new Shape()` не скомпілюється), але вказівники й посилання на нього допустимі й потрібні для поліморфізму.');
w(3,'Навіщо в C++ потрібен віртуальний деструктор? Чи є ця проблема в C#?',
 ['Delete через Base* без virtual викликає лише деструктор бази','Частина похідного класу й її ресурси не звільняються','Приклад: Dragon::hoard (скарб) витікає','Правило: virtual public або protected non-virtual','C#: GC працює з реальним типом, проблеми немає']
 ,'Якщо похідний об\'єкт видаляють через вказівник на базовий клас (`Animal* a = new Dog(); delete a;`), а деструктор бази не `virtual`, викликається лише деструктор бази. Частина об\'єкта, що належить похідному класу, і її ресурси лишаються незвільненими (в прикладі `Dragon` утримує `hoard`, який витікає).\nПравило C++ Core Guidelines: деструктор базового класу має бути public і virtual, або protected і невіртуальним.\nУ C# цієї проблеми немає: збирач сміття завжди працює з фактичним, найбільш похідним типом об\'єкта в керованій купі, а не з типом змінної, тому ланцюжок фіналізаторів відпрацьовує коректно.');
w(4,'Чим відрізняються типи значень і типи посилань у C#? Що таке boxing/unboxing і чому це важливо?',
 ['struct: змінна зберігає сам об\'єкт, копіювання створює незалежну копію','class: змінна зберігає посилання, копіюється лише посилання','ref/in для передачі struct за посиланням','Boxing: value type у object (коробка на купі)','Unboxing: явне приведення, тип має збігатися, інакше InvalidCastException','ArrayList (boxing) проти List<int>']
 ,'У C# рішення приймається на рівні типу: `struct` це value type (змінна зберігає значення безпосередньо, при копіюванні створюється незалежна копія), `class` це reference type (змінна зберігає посилання на об\'єкт у керованій купі, копіюється посилання, тож обидві змінні вказують на один об\'єкт). Приклад: після `TryMove(PointS)` значення `ps.X` не змінилось, а після `TryMove(PointC)` змінилось. Щоб метод змінив struct викликача, використовують `ref`.\nBoxing: присвоєння value type змінній типу `object` створює в купі об\'єкт-«коробку» з копією значення. Unboxing: явне приведення `(int)o`, тип має точно збігатися з тим, що в коробці, інакше `InvalidCastException` (наприклад, `(double)o` для упакованого int; правильно `(double)(int)o`).\nВажливо: boxing не безкоштовний. До Generics усі колекції (`ArrayList`) зберігали object, тож кожен int упаковувався; `List<int>` зберігає int напряму й у кілька разів швидший та економніший за пам\'яттю. Це головна причина появи Generics у C# 2.0.');
w(4,'Порівняйте шаблони C++ і Generics C#.',
 ['Шаблон: інструкція генерувати копію коду для кожного типу при компіляції','Перевірка при інстанціюванні, довгі помилки; compile-time duck typing','Generic: компілюється в IL один раз, перевірка одразу, обмеження where','JIT: окрема версія для value types, спільна для reference types','Code bloat у C++','C++20 concepts ≈ where']
 ,'Обидва механізми дозволяють написати код один раз і використати з різними типами, але моделі різні.\nШаблон C++ (`template <typename T>`) це інструкція компілятору згенерувати окрему копію коду для кожного використаного типу (інстанціювання під час компіляції). Тіло шаблону перевіряється лише при інстанціюванні (compile-time duck typing), тому помилки приходять довгі й заплутані. Багато типів дає «розбухання коду» (code bloat).\nGeneric C# (`Stack<T>`) компілюється в IL один раз; тіло перевіряється одразу при оголошенні, тому `a > b` для довільного T не скомпілюється, потрібне обмеження `where T : IComparable<T>`. Помилку видно біля місця виклику. У runtime JIT для value types генерує окрему версію, а для reference types може використати один і той самий скомпільований код.\nC++20 додав concepts, які дають таку саму зрозумілу помилку, як `where` у C#.');
w(4,'Порівняйте вказівник і посилання в C++. Поясніть на прикладі swap.',
 ['Вказівник: може бути без ініціалізації, переприв\'язуватися, nullptr, арифметика','Посилання: ініціалізується одразу, назавжди, не null','swap за значенням не працює (копії)','SwapByPointer(&x,&y) проти SwapByReference(x,y)','Сучасно: unique_ptr/shared_ptr для володіння, T& для передачі']
 ,'Вказівник `T*` зберігає адресу; його можна оголосити без ініціалізації, переприв\'язати до іншого об\'єкта, порівняти з `nullptr`, виконувати арифметику (`p + 1`). Посилання `T&` має бути ініціалізоване при оголошенні, назавжди прив\'язується до одного об\'єкта й не може бути null.\nSwap: `void Swap(int a, int b)` не працює, бо параметри передаються за значенням, змінюються копії. `SwapByPointer(int* a, int* b)` викликається як `SwapByPointer(&x, &y)` і працює з `*a`; `SwapByReference(int& a, int& b)` викликається як `SwapByReference(x, y)`, синтаксис звичайний. Результат однаковий: `2 1`.\nУ сучасному C++ для володіння ресурсом використовують `unique_ptr`/`shared_ptr`, а `T&` і невласні вказівники для передачі об\'єкта без копіювання. Динамічне зв\'язування працює лише через вказівник чи посилання.');
w(6,'Що таке UML, навіщо він потрібен і коли діаграма не потрібна?',
 ['Мова позначень, не мова програмування й не методологія','Історія: Буч, Рамбо, Якобсон, OMG 1997, ISO','14 діаграм, діаграма класів найпопулярніша','Режими Фаулера: ескіз, креслення, мова програмування','Користь: спільна мова, швидке занурення в код, дешеві зміни','Не потрібна: скрипт на 50 рядків, діаграма яку ніхто не підтримує']
 ,'UML (Unified Modeling Language) це стандартизований набір графічних позначень для опису програмних систем. Це не мова програмування (діаграму не запустити) і не методологія (не каже, як організувати роботу), а мова позначень, як нотний запис.\nВиник як відповідь на «війну нотацій»: Буч, Рамбо й Якобсон («Three Amigos») об\'єдналися в Rational, стандарт передано OMG у 1997, пізніше ISO. UML 2.x має 14 типів діаграм (структурні й поведінкові); діаграма класів найпопулярніша.\nФаулер описав три режими: ескіз, креслення, мова програмування; найчастіше це ескіз.\nНавіщо: спільна мова в команді, швидке занурення в чужий код, дешеві зміни до кодування, документація поруч із кодом (PlantUML, Mermaid), розмова з нерозробниками, співбесіди.\nНе потрібна для скрипта на 50 рядків чи прототипу, для застарілої діаграми, яка розійшлася з кодом, і для того, що видно з коду за один погляд.');
w(6,'Опишіть чотири основні зв\'язки між класами в діаграмі класів: нотацію, ознаки в коді C#, приклад.',
 ['Залежність: пунктир зі стрілкою; параметр/локальна змінна/new/статичний виклик','Асоціація: суцільна лінія; поле','Агрегація: порожній ромб біля цілого; частина ззовні, незалежна, може бути спільною','Композиція: заповнений ромб біля цілого; частина створюється всередині, прихована, зникає разом із цілим','Шкала міцності: залежність → асоціація → агрегація → композиція','Приклади: Barista–CoffeeMachine, Student–Teacher, Playlist–Song, House–Room']
 ,'Залежність: клас лише тимчасово користується іншим. Пунктирна лінія зі стрілкою. У коді: параметр методу, локальна змінна, `new` усередині методу, виклик статичного методу, поля немає (Barista.Serve(CoffeeMachine m, ...)).\nАсоціація: постійний структурний зв\'язок, суцільна лінія, у коді поле чи властивість (Student має поле Teacher curator). Може мати стрілку навігації, роль, множинність.\nАгрегація: «ціле — частини», але частина незалежна й може бути спільною; порожній ромб біля цілого. У коді поле чи колекція, об\'єкти створюються ззовні й передаються (Playlist і Song; пісня в двох плейлистах).\nКомпозиція: найміцніше «ціле — частина»; заповнений ромб біля цілого, множинність біля цілого 1. Частина створюється всередині цілого (`new` у конструкторі чи методі), приховане посилання, не може бути в двох цілих і зникає разом із цілим (House і Room, Order і OrderItem).\nШкала міцності: залежність → асоціація → агрегація → композиція; обирають найслабший зв\'язок, якого достатньо.');
w(6,'Як вирішити, який зв\'язок обрати: асоціація, агрегація чи композиція? Поясніть на прикладі.',
 ['Питання 1: чи має частина сенс без цілого?','Питання 2: чи може частина входити до кількох цілих?','Питання 3: хто створює частину й відповідає за життєвий цикл?','Якщо не впевнені, обирайте просту асоціацію','Один об\'єкт може моделюватися по-різному залежно від задачі (двигун)','Ромб біля цілого']
 ,'У коді всі три виглядають однаково (поле з посиланням), тому вирішує зміст зв\'язку. Три питання:\n1) Чи частина має сенс без цілого? Якщо ні (кімната без будинку, позиція без замовлення), це композиція.\n2) Чи може одна частина входити до кількох цілих? Якщо так (пісня у двох плейлистах), це не композиція.\n3) Хто створює частину й відповідає за її життя? Якщо ціле, це композиція; якщо частина приходить ззовні, це агрегація або проста асоціація.\nЯкщо немає відношення «ціле — частина», а лише «знає про», це асоціація (Student і Teacher).\nПрактичне правило: у сумніві обирайте просту асоціацію. Агрегація спірна (Рамбо назвав її «модельним плацебо»; Фаулер радить обходитися без неї).\nПриклад залежності від вимог: двигун у програмі виробника авто це композиція (виготовляється разом із авто), а в програмі автосервісу це агрегація чи асоціація (двигуни знімають і ставлять на інші авто).');
w(6,'Опишіть, як читати й записувати клас на діаграмі: відсіки, видимість, атрибути, операції, множинність.',
 ['Три відсіки: назва, атрибути, операції','Видимість: + - # ~','Атрибут: видимість ім\'я : Тип [множинність] = значення','Операція: видимість ім\'я(параметр : Тип) : ТипПовернення','Курсив: абстрактний; підкреслення: static; <<interface>>; {readOnly}','Множинність читається з боку класу: 1, 0..1, *, 1..*']
 ,'Клас це прямокутник із трьома відсіками: назва (абстрактна курсивом, зі стереотипом на кшталт <<interface>>), атрибути (поля й автовластивості), операції (методи й конструктори).\nВидимість: `+` public, `-` private, `#` protected, `~` package (internal у C#).\nАтрибут: `видимість ім\'я : Тип [множинність] = початкове значення`, наприклад `- balance : decimal = 0`. Операція: `+ Deposit(amount : decimal) : void`. Тип пишеться після двокрапки (на відміну від C#).\nДодатково: статичний член підкреслюють, абстрактний клас курсивом, властивість лише для читання `{readOnly}`, похідний атрибут `/age`.\nМножинність на лінії: `1`, `0..1`, `*`/`0..*`, `1..*`, `2..5`. Число біля класу означає, скільки його об\'єктів припадає на один об\'єкт на іншому кінці (Group 1 — 1..* Student: одна група має 1+ студентів, студент належить одній групі).\nРівень деталізації залежить від мети: показують рівно стільки, скільки потрібно.');
w(2,'Напишіть на C# клас `BankAccount`: приватне поле `balance`, властивість `Owner` лише для читання, `Deposit` і `Withdraw` з перевіркою, а також власний виняток при недостатніх коштах.',
 ['private decimal balance','public string Owner { get; } і присвоєння в конструкторі','Deposit: перевірка amount > 0','Withdraw: кидає InsufficientFundsException, якщо amount > balance','Виняток успадкований від Exception, ім\'я закінчується на Exception','GetBalance() або властивість лише для читання']
 ,'Один із можливих варіантів:',
 `public class InsufficientFundsException : Exception
{
    public InsufficientFundsException(string message) : base(message) { }
}

public class BankAccount
{
    private decimal balance = 0;
    public string Owner { get; }

    public BankAccount(string owner)
    {
        Owner = owner;
    }

    public void Deposit(decimal amount)
    {
        if (amount > 0) balance += amount;
    }

    public void Withdraw(decimal amount)
    {
        if (amount > balance)
            throw new InsufficientFundsException("Недостатньо коштів на рахунку");
        balance -= amount;
    }

    public decimal GetBalance() => balance;
}`);
w(6,'Для вимог нижче визначте класи, зв\'язки (з видами й множинністю) і обґрунтуйте вибір: «Бібліотека зберігає книжки. Читачі беруть книжки додому. Кожна видача фіксує, яку книжку взяв який читач. Звіт друкує окрема програма».',
 ['Класи: Library, Book, Reader, Loan, ReportPrinter','Library — Book: агрегація 0..* (книжки створюються зовні)','Library — Loan: композиція 0..* (видачу створює бібліотека)','Loan — Book і Loan — Reader: асоціація 1','ReportPrinter — Library: залежність (параметр методу Print)','Метод підкреслення іменників: іменники класи, дієслова операції']
 ,'Іменники: бібліотека, книжка, читач, видача, звіт стають класами `Library`, `Book`, `Reader`, `Loan`, `ReportPrinter`; дієслова стають операціями (`Lend`, `Print`).\nЗв\'язки:\n`Library ◇— Book` агрегація, 0..*: книжки створюються до бібліотеки й можуть переїхати в іншу, бібліотека лише збирає колекцію (`AddBook(Book)`).\n`Library ◆— Loan` композиція, 0..*: видачу створює сама бібліотека в момент видачі (`loans.Add(new Loan(...))`), поза бібліотекою вона не має сенсу.\n`Loan → Book` та `Loan → Reader` асоціація, 1: видача постійно «знає» книжку й читача (властивості).\n`ReportPrinter ┈> Library` залежність: бібліотека лише параметр методу `Print(Library)`, поля немає.\nPlantUML: `Library o-- "0..*" Book`, `Library *-- "0..*" Loan`, `Loan --> "1" Book`, `Loan --> "1" Reader`, `ReportPrinter ..> Library`.');

w(2,"Поясніть інкапсуляцію: які є рівні доступу в C++ і C#, чим відрізняються замовчування, що таке `internal` і `assembly`, навіщо потрібне `this`.",
 ["public, private, protected: хто що бачить","C++: class за замовчуванням private, struct public","C#: члени private, тип верхнього рівня internal","internal діє в межах збірки (assembly: .dll/.exe), а не простору імен","У C++ проміжного рівня internal немає","this: вказівник у C++, посилання в C#; розрізняє поле й параметр"],
 "Інкапсуляція це технічний засіб заборонити прямий доступ до частини полів класу ззовні й дозволити змінювати їх лише через контрольований набір методів, тоді клас сам гарантує узгодженість стану.\nРівні: `private` (бачить лише сам клас), `protected` (клас і нащадки), `public` (будь-який код). У C++ замовчування залежить від слова: `class` усе private, `struct` усе public. У C# члени за замовчуванням private, а тип верхнього рівня `internal`.\n`internal` діє в межах збірки (assembly): фізичний результат компіляції проєкту, файл `.dll` чи `.exe` (один проєкт, одна збірка), а не простору імен. Приклад: бібліотека GameLibrary.dll, де клас Player публічний, а SaveSystem internal. У C++ такого рівня немає.\n`this` усередині нестатичного методу чи конструктора це неявний доступ до поточного об'єкта: у C++ вказівник (`this->balance = balance`), у C# посилання (`this.balance = balance`). Потрібен, коли ім'я параметра збігається з іменем поля. Також на `return this` будується fluent-стиль (`account.Deposit(100).Deposit(50)`).");
w(2,"Опишіть види конструкторів у C++ та C#, делегування конструкторів і правило трьох.",
 ["Конструктор: один раз при створенні, коректний стан","За замовчуванням; власний з параметрами прибирає автоматичний","Копіювання: суто C++ (memberwise copy); у C# копіюється посилання","Делегування: C++11 `: Point(0,0)`, C# `: this(0,0)`","Правило трьох: деструктор, копіювальний конструктор, оператор присвоєння; розширене до п'яти (переміщення)"],
 "Конструктор це метод, що спрацьовує рівно один раз при створенні об'єкта й приводить його в коректний стан. Якщо жодного не написати, компілятор згенерує порожній безпараметричний (конструктор за замовчуванням); щойно додається власний із параметрами, автоматичний зникає (і в C++, і в C#).\nКонструктор копіювання це особливість C++: `Point p2 = p1;` викликає його навіть якщо він не написаний (компілятор копіює кожне поле, memberwise copy). У C# його немає: `Dog d2 = d1;` копіює лише посилання, повну копію треба писати явно.\nДелегування: один конструктор викликає інший того ж класу, щоб не дублювати код. C++ (з C++11): `Point() : Point(0, 0) {}`; C#: `public Point() : this(0, 0) {}`.\nПравило трьох: якщо клас вимагає власного деструктора, конструктора копіювання чи оператора копіювального присвоєння, то, найімовірніше, потрібні всі три, бо копіювання вказівника за замовчуванням неправильне. З C++11 додалися дві операції переміщення, тож правило розширили до «правила п'яти».");
w(2,"Що таке статичні члени класу? Опишіть статичне поле, статичний метод і статичний конструктор у C++ та C#. Чому `Main` статичний?",
 ["Статичне поле: один екземпляр на весь клас, незалежно від кількості об'єктів","Звертання через ім'я класу","У статичному методі немає this","C++: визначення поля зовні класу `int Book::count = 0;`","C#: статичний конструктор виконується один раз, без модифікаторів і параметрів","Main статичний, бо при старті об'єктів ще немає"],
 "Статичний член належить не конкретному об'єкту, а всьому класу й спільний для всіх екземплярів (приклад: лічильник створених `Book`).\nПоле: існує в єдиному екземплярі, хоч створено нуль об'єктів, хоч тисяча. У C++ оголошують у класі (`static int count;`), а визначають і ініціалізують зовні (`int Book::count = 0;`); у C# достатньо `private static int count;`.\nМетод: викликається через ім'я класу (`Book::GetCount()` / `Book.GetCount()`), `this` у ньому недоступний.\nСтатичний конструктор (C#): виконується рівно один раз для класу до створення першого об'єкта чи звернення до першого статичного члена; пишеться без модифікаторів доступу й параметрів, призначений для ініціалізації статичних полів.\n`Main()` статичний, бо на момент запуску програми ще не існує жодного об'єкта.");
w(2,"Опишіть властивості C# (get/set, автоматичні, лише для читання) і порівняйте `readonly` у C# з `const`-полем у C++. Як у C# зробити власний виняток?",
 ["Властивість: зовні поле, всередині геттер і сеттер з перевіркою","Автоматична `{ get; set; }`, лише для читання `{ get; }`","readonly: присвоєння лише в конструкторі чи при оголошенні","C++ const-поле ініціалізується у списку ініціалізації; const може зробити незмінним будь-яке значення","Власний виняток: успадкувати Exception, назва закінчується на Exception"],
 "Властивість (property) зовні виглядає як поле (`p.Age = 25;`), а всередині це геттер і сеттер, у яких можна перевіряти значення (`if (value < 0) throw ...`). Автоматична властивість `public int Age { get; set; }`: компілятор сам створює приховане поле. Властивість лише для читання `public int Age { get; }` встановлюється тільки в конструкторі.\n`readonly` у C#: поле можна присвоїти лише в конструкторі чи при оголошенні. У C++ найближчий аналог `const`-поле, яке ініціалізується в списку ініціалізації конструктора. Різниця: C++ `const` робить незмінним будь-яке значення (навіть локальну змінну), а `readonly` стосується саме полів класу.\nВласний виняток у C#: `public class InsufficientFundsException : Exception { public InsufficientFundsException(string message) : base(message) {} }`; успадковувати треба від `Exception`, не від застарілого `ApplicationException`, і назва закінчується на `Exception`. У C++ за домовленістю успадковують `std::exception` і перевизначають `what()`.");
w(2,"Опишіть інтерфейси в C#: що це, чому клас може реалізувати багато інтерфейсів, що таке explicit interface implementation і чому інтерфейси кращі за глибокі ієрархії наслідування.",
 ["Інтерфейс: суто абстрактний контракт, без реалізації й стану","Клас: один базовий клас + будь-яка кількість інтерфейсів","Проблеми ромба немає (немає спільного стану)","Explicit implementation при конфлікті сигнатур; виклик через посилання на інтерфейс","Слабке зчеплення, SOLID: ISP і DIP"],
 "Інтерфейс це суто абстрактний контракт: він описує, що об'єкт повинен вміти робити (набір методів), але не містить реалізації й стану (полів). Клас у C# може успадковувати лише один клас, але реалізовувати будь-яку кількість інтерфейсів: `class Dog : Animal, IDrawable, IMovable`.\nОскільки в інтерфейсів немає реалізації й власного стану, проблема ромба зникає. Якщо два інтерфейси мають метод з однаковою сигнатурою, але різним змістом (`IEnglishSpeaker.Greet()` і `IUkrainianSpeaker.Greet()`), клас реалізує кожен окремо через explicit interface implementation, а викликати можна лише через посилання на конкретний інтерфейс: `((IEnglishSpeaker)bilingual).Greet()`.\nІнтерфейси вважаються кращою практикою, ніж глибокі ієрархії: вони дають слабкозв'язані системи й лежать в основі принципів SOLID (Interface Segregation і Dependency Inversion). У Java інтерфейси з часом отримали готові реалізації, і проблема ромба повернулася, у C# інтерфейси лишаються чистим контрактом.");
w(3,"Опишіть на прикладі арени (Creature, Warrior, Mage, Dragon) три ключові ідеї поліморфізму: virtual/override, `base.Attack()` та абстрактний метод. Що буде без virtual?",
 ["Один цикл по List<Creature>, виклик залежить від реального типу","virtual у базі, override у похідному; без них спрацьовує тип змінної","base.Attack() доповнює базову поведінку (Mage)","abstract Creature: new Creature() не компілюється","Неперевизначений abstract-метод у нащадка: помилка компіляції","new замість override: приховування"],
 "Арена: `List<Creature>` з Warrior, Mage, Dragon, один цикл `foreach (var c in arena) c.Attack();`. Кожен атакує по-своєму, а код циклу не змінюється при додаванні нових видів істот.\nЦе працює завдяки `virtual` у базовому класі й `override` у похідному (динамічне зв'язування за реальним типом об'єкта). Без них (блок 1.2) `Creature c = new Warrior(...)` викличе метод `Creature`, бо зв'язування статичне, за оголошеним типом. `new` замість `override` дає приховування: через `Creature` спрацює базовий метод, через `Mage` власний.\n`base.Attack()` у `Mage` виконує спершу базову поведінку («удар»), а потім додає власну («вогняна куля»); без цього рядка базовий удар зникає.\nАбстрактний `Creature` має `public abstract void SpecialAbility();` без тіла: `new Creature(...)` не скомпілюється, а нащадок, що не реалізував `SpecialAbility()` (і не abstract), теж дасть помилку компіляції. Кожна істота зобов'язана мати унікальну здібність.");
w(3,"Скільки коштує поліморфізм? Як це вимірювали в лекції, який результат і що таке девіртуалізація?",
 ["Бенчмарк: 200 млн викликів increment() для virtual і не-virtual","Збирати з -O2 / Release","Результат: одиниці чи низькі десятки відсотків, не рази","Сучасні процесори добре прогнозують перехід по vtable","Принцип Страуструпа: не платиш за те, чим не користуєшся","Девіртуалізація усуває різницю, якщо тип відомий компілятору"],
 "Експеримент: двічі викликати метод `increment()` 200 мільйонів разів у циклі, один раз для звичайного, один раз для `virtual`, і порівняти час (C++ з `std::chrono::steady_clock`, C# з `Stopwatch`). Збирати треба з оптимізацією (`g++ -O2`, `dotnet run -c Release`), інакше Debug-код маскує різницю.\nТиповий результат: різниця в одиниці чи низькі десятки відсотків, а не в рази, бо сучасні процесори прогнозують перехід по vtable майже так само дешево, як звичайний, особливо коли весь цикл викликається один і той самий фактичний тип.\nПринцип Страуструпа «не платиш за те, чим не користуєшся» виконується не буквально (не в нуль), а в тому сенсі, що невелика плата стосується лише тих методів, які оголошено віртуальними; решта програми її не відчуває.\nДевіртуалізація: якщо з коду видно, що вказівник точно вказує на об'єкт конкретного типу (локальна змінна створена як Warrior), компілятор може замінити виклик через vtable на прямий і прибрати різницю.");
w(4,"Покроково опишіть, як написати власний узагальнений `Stack<T>` на C# та C++: поле, `Push`, `Pop`, обробка порожнього стеку, використання з різними типами.",
 ["Клас з параметром типу: template<typename T> / Stack<T>","Поле: std::vector<T> / List<T>","IsEmpty і Count","Push додає в кінець","Pop: перевірка IsEmpty, виняток, повернення останнього й видалення","Використання для int і string без зміни коду"],
 "Крок 1: каркас і поле для зберігання елементів. C++: `template <typename T> class Stack { std::vector<T> items; ... };`, C#: `class Stack<T> { private readonly List<T> items = new(); ... }`; додаємо `IsEmpty` і `Count`.\nКрок 2: `Push(T value)` додає елемент у кінець (`push_back` / `Add`). `Pop()` спершу перевіряє `IsEmpty`: якщо порожній, кидає виняток (`std::out_of_range` у C++, `InvalidOperationException` у C#), інакше бере останній елемент (`items.back()` / `items[^1]`), видаляє його (`pop_back` / `RemoveAt(items.Count - 1)`) і повертає.\nКрок 3: той самий клас працює з `Stack<int>` і `Stack<string>` без зміни коду: `ints.Push(1); ints.Push(2); ints.Push(3); ints.Pop()` повертає 3; для рядків `names.Pop()` повертає останній доданий. Четвертий `Pop()` для стеку з трьох елементів кине виняток.\nРізниця моделей: C++ згенерує окрему копію для кожного типу, C# компілює generic один раз.",
 `class Stack<T>
{
    private readonly List<T> items = new();
    public bool IsEmpty => items.Count == 0;
    public int Count => items.Count;

    public void Push(T value) => items.Add(value);

    public T Pop()
    {
        if (IsEmpty) throw new InvalidOperationException("Stack порожній");
        T top = items[^1];
        items.RemoveAt(items.Count - 1);
        return top;
    }
}`);
w(6,"Як зв'язки діаграми класів відображаються в коді C#? Для кожного з чотирьох зв'язків назвіть ознаку в коді.",
 ["Залежність: параметр методу, локальна змінна, new в методі, статичний виклик; поля немає","Асоціація: поле чи властивість з посиланням","Агрегація: поле/колекція, об'єкти створюються ззовні й передаються (Add, конструктор)","Композиція: new усередині класу (поле/метод), посилання приховане, нікому більше не віддається","Однакові поля в коді: різниця в наміру проєктувальника","Множинність: поле, `T?`, колекція"],
 "Залежність: клас отримує інший як параметр методу, створює його як локальну змінну (`new B()`), повертає його або викликає статичний метод; поля, що тримало б його постійно, немає (`Barista.Serve(CoffeeMachine machine, ...)`, `Logger.Log(...)`).\nАсоціація: постійний структурний зв'язок, у коді поле чи властивість з посиланням на інший клас (`private Teacher curator;`).\nАгрегація: клас-ціле має поле чи колекцію частин, а самі частини створюються поза ним і передаються ззовні (конструктор чи `Add`): `playlist.Add(song)`, `library.AddBook(book)`.\nКомпозиція: частина створюється всередині цілого (`new` у конструкторі чи методі: `loans.Add(new Loan(...))`, `items.Add(new OrderItem(...))`), посилання на неї приховане (private), назовні вона не віддається (або віддається лише копією чи `IReadOnlyList`).\nВажливо: агрегація й асоціація в C# виглядають майже однаково (поле з посиланням), різниця в наміру проєктувальника. Множинність виражається так: `1` поле, що завжди заповнене; `0..1` поле, що допускає null (`Passport?`); `*`, `1..*` колекція (`List<T>`, `T[]`, `IEnumerable<T>`).");
w(6,"Назвіть типові помилки на діаграмах класів і складіть чек-лист хорошої діаграми.",
 ["Діаграма як копія коду (всі приватні поля)","Ромб біля частини замість цілого","Множинність прочитана з неправильного боку","«Ромбова лихоманка»: усе композицією","Колекція намальована окремим класом","Занадто великі схеми (норма 5–10 класів)","Нечіткі імена (Manager, Helper)","Діаграма розійшлася з кодом"],
 "Типові помилки: 1) діаграма як копія коду (виписано всі приватні поля) і треба залишити лише важливе для мети; 2) ромб біля частини замість цілого (завжди біля цілого); 3) множинність прочитана з неправильного боку; 4) «ромбова лихоманка»: усі зв'язки композицією, бо «звучить солідно», а за відсутності чіткої власності треба обирати просту асоціацію; 5) колекція намальована окремим класом (`List<Book>`) замість лінії до `Book` з множинністю `0..*`; 6) занадто великі схеми (розбивати на 5–10 класів); 7) змішані рівні деталізації (поруч Library і string); 8) двонаправлені зв'язки «про всяк випадок»; 9) нечіткі імена (Manager, Helper, Data, Info замість LoanRegistry, PriceCalculator); 10) діаграма розійшлася з кодом.\nЧек-лист: зрозуміло, для кого й навіщо діаграма; назви класів іменники в однині; лише суттєві атрибути й операції; для кожного зв'язку найслабший із тих, що відповідають задачі; ромби біля цілого; множинність записано біля кінців ліній і прочитано в обидва боки; колекції не намальовано окремими класами; не більше 10 класів і мінімум перетинів ліній; діаграма відповідає актуальному коду.");
w(6,"Які інструменти й підходи існують для створення діаграм? Порівняйте графічні редактори й «діаграми як код», поясніть пряме й зворотне проєктування та роль ШІ-асистентів.",
 ["Графічні: draw.io, Lucidchart, Miro, FigJam","Діаграми як код: PlantUML, Mermaid (у репозиторії, видно в pull request)","Вбудовані: Class Designer у Visual Studio","Пряме проєктування: діаграма, потім код","Зворотне: діаграма з існуючого коду, потім «прибирання»","ШІ: чернетка, яку перевіряє інженер"],
 "Графічні редактори (draw.io, Lucidchart, дошки Miro та FigJam): швидко й наочно, повний контроль над розташуванням, але складно порівнювати версії, файл «живе» окремо від коду.\nДіаграми як код (PlantUML, Mermaid): текст зберігається в репозиторії, зміни видно в pull request, легко генерувати й редагувати, GitHub і GitLab показують Mermaid у Markdown; недолік: розташування елементів обирає програма. Записи зв'язків: `A ..> B` залежність, `A --> B` асоціація, `A o-- B` агрегація, `A *-- B` композиція, `A <|-- B` узагальнення, `A <|.. B` реалізація.\nВбудовані в IDE (Class Designer у Visual Studio): будуються безпосередньо з коду, але зазвичай показують забагато деталей.\nПряме проєктування (forward engineering): спочатку діаграма, потім код. Зворотне (reverse engineering): діаграму будують автоматично з існуючого коду, це корисно для розуміння чужого проєкту, але результат треба «прибирати» від зайвих деталей.\nШІ-асистенти: можна дати код і попросити діаграму PlantUML (або навпаки), але результат обов'язково перевіряють: модель може переплутати агрегацію з композицією, додати зайві зв'язки чи пропустити важливі. Це чернетка, відповідальність за змістовність лишається за інженером.");
w(6,"Напишіть на C# клас `Lamp` за діаграмою: приватні `isOn : bool = false` і `brightness : int = 0`; публічні `TurnOn()`, `TurnOff()`, `SetBrightness(level : int)`, `Describe() : string`. Яскравість завжди від 0 до 100.",
 ["Приватні поля з початковими значеннями","TurnOn/TurnOff змінюють isOn","SetBrightness: обрізання до 0..100","Describe: «Lamp is OFF» або «Lamp is ON, brightness N%»","brightness не обнуляється при TurnOff"],
 "Один з варіантів розв'язання. Зверніть увагу: після `TurnOff()` значення `brightness` не обнуляється, воно просто не показується. Очікуваний вивід для послідовності Describe, TurnOn, SetBrightness(150), SetBrightness(-20), TurnOff: `Lamp is OFF`, `Lamp is ON, brightness 100%`, `Lamp is ON, brightness 0%`, `Lamp is OFF`.",
 `public class Lamp
{
    private bool isOn = false;
    private int brightness = 0;

    public void TurnOn() { isOn = true; }
    public void TurnOff() { isOn = false; }

    public void SetBrightness(int level)
    {
        if (level < 0) level = 0;
        if (level > 100) level = 100;
        brightness = level;
    }

    public string Describe()
    {
        return isOn ? $"Lamp is ON, brightness {brightness}%" : "Lamp is OFF";
    }
}`);
w(6,"Покажіть двонаправлену асоціацію Teacher—Student на коді й поясніть ризик.",
 ["Teacher має List<Student>, Student має Teacher Curator","AssignCurator оновлює обидва кінці зв'язку","t.AddStudent(a) напряму залишить зв'язок неузгодженим","Висновок: тримати два посилання синхронними","Практики радять однонаправлені асоціації"],
 "Куратор знає своїх студентів, а студент свого куратора. Метод `AssignCurator` оновлює обидва кінці зв'язку.\nРизик: якщо хтось викличе `t.AddStudent(a)` напряму, минаючи `AssignCurator`, куратор «знатиме» студента, а студент про куратора ні, і зв'язок стане неузгодженим. Тому двонаправлені асоціації потребують обережності, а практики радять за можливості обирати однонаправлені (на діаграмі стрілка від Student до Teacher).",
 `public class Teacher
{
    public string Name { get; }
    private List<Student> students = new List<Student>();
    public Teacher(string name) { Name = name; }
    public void AddStudent(Student s) { students.Add(s); }
}

public class Student
{
    public string Name { get; }
    public Teacher Curator { get; private set; }
    public Student(string name) { Name = name; }

    public void AssignCurator(Teacher t)
    {
        Curator = t;
        t.AddStudent(this);   // оновлюємо обидва кінці
    }
}`);
